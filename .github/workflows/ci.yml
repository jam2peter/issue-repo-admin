name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile scripts/repo_admin.py
      - run: python3 -m json.tool repo-admin.example.json >/dev/null
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Sanitization scan
        run: |
          set -euo pipefail
          ! grep -RInE 'JamPeter-Infrastructure|Laboratório JamPeter|PROJECTS_TOKEN|192\.168\.|lab\.jampeter\.com\.br' --exclude-dir=.git --exclude=ci.yml .
          ! grep -RInE '(ghp_|github_pat_|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' --exclude-dir=.git --exclude=ci.yml .
